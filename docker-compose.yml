
services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: dks
      POSTGRES_PASSWORD: dks_secret
      POSTGRES_DB: dks_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
      - uploads:/app/uploads
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://dks:dks_secret@db:5432/dks_db
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - redis

  worker:
    build: .
    command: arq app.workers.ingestion_worker.WorkerSettings
    volumes:
      - .:/app
      - uploads:/app/uploads
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://dks:dks_secret@db:5432/dks_db
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - redis

volumes:
  pgdata:
  uploads: